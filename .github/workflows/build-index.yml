name: Build card index

# Ricostruisce cards_index.json: tutte le carte Pokémon Double Rare o superiore
# su Cardtrader (così entrano anche i set nuovi)
# - Si lancia a mano dalla scheda "Actions" (pulsante "Run workflow")
# - Gira da solo ogni lunedì notte
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Costruisci indice carte
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: python build_card_index.py

      - name: Aggiorna i prezzi Cardmarket delle carte nuove
        continue-on-error: true
        run: python update_cardmarket_prices.py

      - name: Salva indice nel repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in cards_index.json rarities_seen.json cardmarket_prices.json cardmarket_unmatched.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if ! git diff --staged --quiet; then
            git commit -m "Aggiorna indice carte"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              echo "Push fallito (tentativo $i), riprovo tra 5 secondi..."
              sleep 5
            done
          fi
